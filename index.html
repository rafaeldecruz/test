<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Beer Invaders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #090a0f; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #safe-top { height: env(safe-area-inset-top); position: fixed; top: 0; width: 0; pointer-events: none; }
    </style>
</head>
<body>
<div id="safe-top"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── resize ──────────────────────────────────────────────────────────────────
function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function W() { return canvas.width; }
function H() { return canvas.height; }

// Safe area for iPhone notch/dynamic island
function safeTop() {
    return Math.max(document.getElementById('safe-top').getBoundingClientRect().height, 0);
}

// ── state: 'title' | 'playing' | 'dead' | 'won' ─────────────────────────────
let state = 'title';

// ── game vars ────────────────────────────────────────────────────────────────
const COLS = 8, ROWS = 4;
let player, bullets, eBullets, enemies, explosions;
let score, lives, dir, speed, eTimer, frame, cooldown;

function startGame() {
    player     = { x: W() / 2, y: H() - 90, spd: 5 };
    bullets    = []; eBullets = []; frame = 0; cooldown = 0;
    explosions = [];
    score = 0; lives = 3; dir = 1; speed = 0.27; eTimer = 0;
    spawnEnemies();
    state = 'playing';
}

function spawnEnemies() {
    enemies = [];
    const mx = 44, sx = (W() - mx * 2) / (COLS - 1);
    const sy = H() * 0.18;
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            enemies.push({ x: mx + c * sx, y: sy + r * 54, alive: true, f: 0 });
}

// ── input ────────────────────────────────────────────────────────────────────
const held = { left: false, right: false };
const keys = {};

document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

const touches = new Map(); // pointerId -> side

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'title') { startGame(); return; }
    if (state === 'dead' || state === 'won') { state = 'title'; return; }
    const side = getSide(e.clientX);
    touches.set(e.pointerId, side);
    held[side] = true;
}, { passive: false });

canvas.addEventListener('pointerup', e => {
    e.preventDefault();
    const side = touches.get(e.pointerId);
    if (side) { touches.delete(e.pointerId); recalcHeld(); }
}, { passive: false });

canvas.addEventListener('pointercancel', e => {
    e.preventDefault();
    touches.delete(e.pointerId); recalcHeld();
}, { passive: false });

function getSide(x) {
    return x < W() / 2 ? 'left' : 'right';
}
function recalcHeld() {
    held.left = false; held.right = false;
    for (const side of touches.values()) held[side] = true;
}

// ── explosion helper ──────────────────────────────────────────────────────────
function spawnExplosion(x, y) {
    for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd   = Math.random() * 3 + 1;
        explosions.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1.0,
            r: Math.random() * 3 + 2
        });
    }
}

// ── update ───────────────────────────────────────────────────────────────────
function update() {
    if (state !== 'playing') return;
    frame++;

    const moveL = held.left  || keys['ArrowLeft']  || keys['a'];
    const moveR = held.right || keys['ArrowRight'] || keys['d'];

    if (moveL && player.x > 22)       player.x -= player.spd;
    if (moveR && player.x < W() - 22) player.x += player.spd;

    // Auto-fire
    if (cooldown > 0) cooldown--;
    if (cooldown === 0) {
        bullets.push({ x: player.x, y: player.y - 28 });
        cooldown = 10;
    }

    // Player bullets
    bullets.forEach(b => b.y -= 11);
    bullets = bullets.filter(b => b.y > 0);

    // Enemy bullets
    eBullets.forEach(b => b.y += b.vy);
    eBullets = eBullets.filter(b => b.y < H());

    // Explosions
    explosions.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.045; });
    explosions = explosions.filter(p => p.life > 0);

    // Move enemies
    const alive = enemies.filter(e => e.alive);
    if (!alive.length) { state = 'won'; return; }

    enemies.forEach(e => { if (e.alive) e.x += dir * speed; });
    if (frame % 22 === 0) enemies.forEach(e => { if (e.alive) e.f++; });

    const lx = Math.min(...alive.map(e => e.x));
    const rx = Math.max(...alive.map(e => e.x));
    if (rx > W() - 28 || lx < 28) {
        dir *= -1;
        enemies.forEach(e => { if (e.alive) e.y += 22; });
        speed += 0.02;
    }

    // Enemy shoot
    eTimer++;
    if (eTimer >= Math.max(80, 240 - alive.length * 4)) {
        eTimer = 0;
        const s = alive[Math.floor(Math.random() * alive.length)];
        eBullets.push({ x: s.x, y: s.y + 20, vy: 1.5 });
    }

    // Bullet hits enemies
    bullets.forEach(b => {
        enemies.forEach(e => {
            if (e.alive && Math.abs(b.x - e.x) < 22 && Math.abs(b.y - e.y) < 24) {
                e.alive = false; b.y = -1; score += 10;
                spawnExplosion(e.x, e.y);
            }
        });
    });

    // Enemy bullet hits player
    eBullets.forEach(b => {
        if (Math.abs(b.x - player.x) < 16 && Math.abs(b.y - player.y) < 16) {
            lives--; b.y = H() + 1; player.x = W() / 2;
            spawnExplosion(player.x, player.y);
            if (lives <= 0) state = 'dead';
        }
    });

    // Enemies reach player
    if (alive.some(e => e.y > player.y - 28)) state = 'dead';
}

// ── stars ────────────────────────────────────────────────────────────────────
const STARS = Array.from({ length: 130 }, () => ({
    fx: Math.random(), fy: Math.random(),
    r: Math.random() * 1.5 + 0.3,
    a: Math.random() * 0.8 + 0.2
}));

// ── draw helpers ─────────────────────────────────────────────────────────────
function drawBottle(x, y, f) {
    const s = 15;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = f % 2 === 0 ? '#c8a020' : '#e0b824';
    ctx.beginPath(); ctx.roundRect(-s * 0.6, -s * 0.5, s * 1.2, s * 1.8, s * 0.25); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(-s * 0.38, s * 0.1, s * 0.76, s * 0.68);
    ctx.fillStyle = '#7a5a0f';
    ctx.fillRect(-s * 0.25, -s * 1.08, s * 0.5, s * 0.62);
    ctx.fillStyle = '#cc2200';
    ctx.beginPath(); ctx.arc(0, -s * 1.08, s * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawShip(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#00ccff';
    ctx.beginPath();
    ctx.moveTo(0, -24); ctx.lineTo(20, 12); ctx.lineTo(10, 6);
    ctx.lineTo(0, 10);  ctx.lineTo(-10, 6); ctx.lineTo(-20, 12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff7700';
    ctx.beginPath(); ctx.ellipse(0, 12, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawRoundBtn(x, y, label) {
    const r = 30;
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
    ctx.fillText(label, x, y + 7);
}

// ── draw ─────────────────────────────────────────────────────────────────────
function draw() {
    const w = W(), h = H();
    const st = safeTop();
    ctx.fillStyle = '#090a0f';
    ctx.fillRect(0, 0, w, h);

    // Stars
    STARS.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${s.a})`;
        ctx.beginPath(); ctx.arc(s.fx * w, s.fy * h, s.r, 0, Math.PI * 2); ctx.fill();
    });

    // ── Title ──
    if (state === 'title') {
        const cy = h * 0.36;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffdd00';
        ctx.font = `bold ${Math.min(w * 0.12, 52)}px Arial`;
        ctx.fillText('BEER', w / 2, cy);
        ctx.fillText('INVADERS', w / 2, cy + Math.min(w * 0.14, 62));

        // Bottles below the title
        const by = cy + Math.min(w * 0.14, 62) + 60;
        drawBottle(w / 2 - 60, by, 0);
        drawBottle(w / 2,      by, 1);
        drawBottle(w / 2 + 60, by, 0);

        ctx.fillStyle = '#ffffff';
        ctx.font = `${Math.min(w * 0.055, 22)}px Arial`;
        ctx.fillText('Нажми чтобы начать', w / 2, by + 70);

        ctx.fillStyle = '#555';
        ctx.font = `${Math.min(w * 0.04, 16)}px Arial`;
        ctx.fillText('< удерживай  |  удерживай >', w / 2, h * 0.9);
        return;
    }

    // ── Game Over / Won ──
    if (state === 'dead' || state === 'won') {
        ctx.textAlign = 'center';
        ctx.font = `bold ${Math.min(w * 0.11, 48)}px Arial`;
        ctx.fillStyle = state === 'dead' ? '#ff4444' : '#ffcc00';
        ctx.fillText(state === 'dead' ? 'GAME OVER' : 'YOU WIN!', w / 2, h / 2 - 30);
        ctx.fillStyle = 'white';
        ctx.font = `${Math.min(w * 0.065, 28)}px Arial`;
        ctx.fillText(`Score: ${score}`, w / 2, h / 2 + 24);
        ctx.fillStyle = '#aaa';
        ctx.font = `${Math.min(w * 0.047, 20)}px Arial`;
        ctx.fillText('Нажми чтобы сыграть снова', w / 2, h / 2 + 70);
        return;
    }

    // ── Playing ──
    enemies.forEach(e => { if (e.alive) drawBottle(e.x, e.y, e.f); });
    drawShip(player.x, player.y);

    ctx.fillStyle = '#00ffff';
    bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 14));
    ctx.fillStyle = '#ff5500';
    eBullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));

    // Explosions
    explosions.forEach(p => {
        ctx.fillStyle = `rgba(255,${Math.floor(p.life * 180)},0,${p.life.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
    });

    // HUD — placed below safe area
    const hudY = st + 50;
    ctx.font = 'bold 18px Arial'; ctx.fillStyle = 'white';
    ctx.textAlign = 'left';   ctx.fillText(`Score: ${score}`, 18, hudY);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 20px Arial';
    ctx.fillText('BEER INVADERS', w / 2, hudY);
    ctx.textAlign = 'right';  ctx.fillStyle = '#ff4466'; ctx.font = 'bold 18px Arial';
    ctx.fillText('♥'.repeat(lives), w - 18, hudY);

    // Round movement buttons — side by side at bottom center
    const btnY = h - 52;
    drawRoundBtn(w / 2 - 52, btnY, '<');
    drawRoundBtn(w / 2 + 52, btnY, '>');
}

// ── loop ──────────────────────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }

requestAnimationFrame(() => { resize(); loop(); });
</script>
</body>
</html>
