<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hello World</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            background-color: #090a0f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            margin: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        h1 {
            position: relative;
            z-index: 1;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        body {
            perspective: 800px;
        }

        h1 {
            font-size: 3rem;
            color: #ffffff;
            text-shadow:
                1px 1px 0 #aaa,
                2px 2px 0 #999,
                3px 3px 0 #888,
                4px 4px 0 #777,
                5px 5px 0 #666,
                6px 6px 12px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <h1>Hello World!</h1>
    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;

        function newStar() {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * 80;
            return {
                x: cx + Math.cos(angle) * dist,
                y: cy + Math.sin(angle) * dist,
                px: cx + Math.cos(angle) * dist,
                py: cy + Math.sin(angle) * dist,
                speed: Math.random() * 2 + 1,
                angle
            };
        }

        const stars = Array.from({ length: 300 }, newStar);

        function draw() {
            ctx.fillStyle = 'rgba(9, 10, 15, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.px = star.x;
                star.py = star.y;
                star.speed *= 1.04;
                star.x += Math.cos(star.angle) * star.speed;
                star.y += Math.sin(star.angle) * star.speed;

                const dist = Math.hypot(star.x - cx, star.y - cy);
                const alpha = Math.min(dist / 200, 1);

                ctx.beginPath();
                ctx.moveTo(star.px, star.py);
                ctx.lineTo(star.x, star.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = Math.min(star.speed / 10, 2);
                ctx.stroke();

                if (star.x < 0 || star.x > canvas.width || star.y < 0 || star.y > canvas.height) {
                    Object.assign(star, newStar());
                }
            });

            requestAnimationFrame(draw);
        }

        draw();

        const h1 = document.querySelector('h1');

        function applyTilt(beta, gamma) {
            const rotX = Math.max(-30, Math.min(30, beta * 0.5));
            const rotY = Math.max(-30, Math.min(30, gamma * 0.5));
            h1.style.transform = `rotateX(${-rotX}deg) rotateY(${rotY}deg)`;
        }

        function startOrientation() {
            window.addEventListener('deviceorientation', e => {
                applyTilt(e.beta, e.gamma);
            });
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            // iOS 13+
            document.addEventListener('click', () => {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') startOrientation();
                });
            }, { once: true });
        } else {
            startOrientation();
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
        });
    </script>
</body>
</html>
