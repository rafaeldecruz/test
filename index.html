<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 10px;
        }

        #score {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        canvas {
            border: 3px solid #e94560;
            background-color: #16213e;
        }

        #message {
            color: #fff;
            font-size: 1rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Змейка</h1>
    <div id="score">Счёт: 0</div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="message">Нажми пробел чтобы начать</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const size = 20;
        const cols = canvas.width / size;
        const rows = canvas.height / size;

        let snake, dir, food, score, running, interval;

        function init() {
            snake = [{x: 10, y: 10}];
            dir = {x: 1, y: 0};
            score = 0;
            running = true;
            document.getElementById('score').textContent = 'Счёт: 0';
            document.getElementById('message').textContent = '';
            spawnFood();
            clearInterval(interval);
            interval = setInterval(loop, 150);
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * cols),
                y: Math.floor(Math.random() * rows)
            };
        }

        function loop() {
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return gameOver();
            if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').textContent = 'Счёт: ' + score;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Еда
            ctx.fillStyle = '#e94560';
            ctx.fillRect(food.x * size, food.y * size, size - 1, size - 1);

            // Змейка
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#4ecca3' : '#3ba88a';
                ctx.fillRect(s.x * size, s.y * size, size - 1, size - 1);
            });
        }

        function gameOver() {
            clearInterval(interval);
            running = false;
            document.getElementById('message').textContent = 'Игра окончена! Пробел — начать заново';
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                if (!running) init();
                return;
            }
            if (e.key === 'ArrowUp' && dir.y === 0) dir = {x: 0, y: -1};
            if (e.key === 'ArrowDown' && dir.y === 0) dir = {x: 0, y: 1};
            if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x: -1, y: 0};
            if (e.key === 'ArrowRight' && dir.x === 0) dir = {x: 1, y: 0};
        });

        draw();
    </script>
</body>
</html>
