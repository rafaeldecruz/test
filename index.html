<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beer Invaders">
    <link rel="manifest" href="manifest.json">
    <title>Beer Invaders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #090a0f; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #safe-top { height: env(safe-area-inset-top); position: fixed; top: 0; width: 0; pointer-events: none; }
    </style>
</head>
<body>
<div id="safe-top"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── resize ───────────────────────────────────────────────────────────────────
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
function W() { return canvas.width; }
function H() { return canvas.height; }
function safeTop() { return Math.max(document.getElementById('safe-top').getBoundingClientRect().height, 0); }

// ── icon ─────────────────────────────────────────────────────────────────────
function buildIcon() {
    const ic = document.createElement('canvas'); ic.width = ic.height = 180;
    const cx = ic.getContext('2d'); const s = 38, x = 90, y = 108;
    cx.fillStyle = '#090a0f'; cx.fillRect(0, 0, 180, 180);
    cx.save(); cx.translate(x, y);
    cx.fillStyle = '#e0b824'; cx.beginPath(); cx.roundRect(-s*.6,-s*.5,s*1.2,s*1.8,s*.25); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.22)'; cx.fillRect(-s*.38,s*.1,s*.76,s*.68);
    cx.fillStyle = '#7a5a0f'; cx.fillRect(-s*.25,-s*1.08,s*.5,s*.62);
    cx.fillStyle = '#cc2200'; cx.beginPath(); cx.arc(0,-s*1.08,s*.28,0,Math.PI*2); cx.fill();
    cx.restore();
    const link = document.createElement('link'); link.rel = 'apple-touch-icon';
    link.href = ic.toDataURL('image/png'); document.head.appendChild(link);
}
buildIcon();

// ── level configs ─────────────────────────────────────────────────────────────
const LEVELS = [
    { speed: 0.27, eBulletVy: 1.5, eTimerBase: 240 },
    { speed: 0.38, eBulletVy: 2.1, eTimerBase: 200 },
    { speed: 0.50, eBulletVy: 2.7, eTimerBase: 165 },
    { speed: 0.63, eBulletVy: 3.3, eTimerBase: 130 },
    { speed: 0.80, eBulletVy: 4.0, eTimerBase: 100 },
];

// ── state ────────────────────────────────────────────────────────────────────
// states: 'title' | 'stage' | 'playing' | 'levelclear' | 'dead' | 'won'
let state = 'title';
let currentLevel = 0; // 0..4
let totalScore   = 0;

// ── game vars ─────────────────────────────────────────────────────────────────
const COLS = 8, ROWS = 4;
let player, bullets, eBullets, enemies, explosions;
let score, lives, dir, speed, eBulletVy, eTimerBase, eTimer, frame, cooldown;
let bonuses = []; // падающие бонусы
let doubleGunTimer = 0; // кол-во фреймов двойного выстрела
const DOUBLE_GUN_DUR = 600; // 10 секунд @ 60fps
let levelScore = 0; // score earned this level

// stage-screen vars
let stageTimer  = 0; // counts up in frames
const STAGE_DUR = 180; // 3 seconds @ 60fps

function goToStage() {
    stageTimer = 0;
    state = 'stage';
}

function startLevel() {
    const cfg  = LEVELS[currentLevel];
    player     = { x: W() / 2, y: H() - 140, spd: 5 };
    bullets    = []; eBullets = []; frame = 0; cooldown = 0;
    explosions = []; bonuses = []; doubleGunTimer = 0;
    score      = 0; lives = 3; dir = 1;
    speed      = cfg.speed;
    eBulletVy  = cfg.eBulletVy;
    eTimerBase = cfg.eTimerBase;
    eTimer     = 0;
    spawnEnemies();
    state = 'playing';
}

function spawnEnemies() {
    enemies = [];
    const mx = 44, sx = (W() - mx * 2) / (COLS - 1);
    const sy = H() * 0.18;
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            enemies.push({ x: mx + c * sx, y: sy + r * 54, alive: true, f: 0 });
}

// ── input ────────────────────────────────────────────────────────────────────
const held = { left: false, right: false, fire: false };
const keys = {};

document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

const touches = new Map();

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'gpdiag') { if (diagStep >= DIAG_LABELS.length) { state = 'title'; } return; }
    if (state === 'title')      { totalScore = 0; currentLevel = 0; goToStage(); return; }
    if (state === 'stage')      { return; } // wait for timer
    if (state === 'dead')       { state = 'title'; return; }
    if (state === 'won')        { state = 'title'; return; }
    if (state === 'levelclear') { advanceLevel(); return; }
    const side = getSide(e.clientX, e.clientY);
    touches.set(e.pointerId, side);
    if (side === 'fire') cooldown = 0;
    held[side] = true;
}, { passive: false });

canvas.addEventListener('pointerup', e => {
    e.preventDefault();
    const side = touches.get(e.pointerId);
    if (side) { touches.delete(e.pointerId); recalcHeld(); }
}, { passive: false });

canvas.addEventListener('pointercancel', e => {
    e.preventDefault(); touches.delete(e.pointerId); recalcHeld();
}, { passive: false });

function getSide(x, y) {
    const w = W(), h = H();
    if (x > w * 0.3 && x < w * 0.7 && y > h * 0.65) return 'fire';
    return x < w / 2 ? 'left' : 'right';
}
function recalcHeld() {
    held.left = false; held.right = false; held.fire = false;
    for (const side of touches.values()) held[side] = true;
}

// ── gamepad ───────────────────────────────────────────────────────────────
const gp = { left: false, right: false };
let gpPrevA = false;
let gpConnected = false;
window.addEventListener('gamepadconnected',    () => { gpConnected = true; });
window.addEventListener('gamepaddisconnected', () => { gpConnected = false; });

// Настраиваемый маппинг (меняется через диагностику)
const gpMap = { left: 14, right: 15, action: 0, axisX: 0 };

function pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (let i = 0; i < pads.length; i++) { if (pads[i]) { pad = pads[i]; break; } }
    if (!pad) { gp.left = false; gp.right = false; gpPrevA = false; return; }

    if (state === 'gpdiag') { return; } // диагностика рисует сама

    // Select+Start → войти в диагностику
    if (pad.buttons[8]?.pressed && pad.buttons[9]?.pressed && state === 'title') {
        diagStep = 0; diagPrevPressed = []; state = 'gpdiag'; return;
    }

    const axisX = pad.axes[gpMap.axisX] || 0;
    gp.left  = axisX < -0.3 || !!(pad.buttons[gpMap.left]?.pressed);
    gp.right = axisX >  0.3 || !!(pad.buttons[gpMap.right]?.pressed);
    const aPressed = !!(pad.buttons[gpMap.action]?.pressed);
    if (aPressed && !gpPrevA) {
        if      (state === 'title')      { totalScore = 0; currentLevel = 0; goToStage(); }
        else if (state === 'dead')       { state = 'title'; }
        else if (state === 'won')        { state = 'title'; }
        else if (state === 'levelclear') { advanceLevel(); }
    }
    gpPrevA = aPressed;
}

// ── gamepad diagnostics ───────────────────────────────────────────────────
let diagStep = 0; // 0=left 1=right 2=action
const DIAG_LABELS = ['Нажми ВЛЕВО', 'Нажми ВПРАВО', 'Нажми СТАРТ/A'];
const DIAG_KEYS   = ['left', 'right', 'action'];
let diagPrevPressed = [];

function drawGpDiag() {
    const w = W(), h = H();
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (let i = 0; i < pads.length; i++) { if (pads[i]) { pad = pads[i]; break; } }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(w*0.06,24)}px Arial`;
    ctx.fillText('Настройка контроллера', w/2, h*0.15);

    if (!pad) {
        ctx.fillStyle = '#ff4466';
        ctx.font = `${Math.min(w*0.05,20)}px Arial`;
        ctx.fillText('Контроллер не найден', w/2, h*0.5);
        ctx.fillStyle = '#aaa';
        ctx.fillText('Нажми на экран чтобы выйти', w/2, h*0.65);
        return;
    }

    // шаги
    for (let i = 0; i < DIAG_LABELS.length; i++) {
        const done = i < diagStep;
        const active = i === diagStep;
        ctx.fillStyle = done ? '#44ff88' : active ? '#ffe033' : '#555';
        ctx.font = `${active ? 'bold ' : ''}${Math.min(w*0.055,22)}px Arial`;
        ctx.fillText((done ? '✓ ' : '') + DIAG_LABELS[i], w/2, h*0.32 + i*h*0.12);
    }

    if (diagStep < DIAG_LABELS.length) {
        // найти нажатую кнопку (только новое нажатие)
        const pressed = [];
        pad.buttons.forEach((b, i) => { if (b.pressed) pressed.push(i); });
        // ось тоже
        let axisBtn = -1;
        if ((pad.axes[0]||0) < -0.5) axisBtn = 100; // ось влево
        if ((pad.axes[0]||0) >  0.5) axisBtn = 101; // ось вправо

        const newBtn = pressed.find(i => !diagPrevPressed.includes(i));
        const newAxis = axisBtn !== -1 && !diagPrevPressed.includes(axisBtn) ? axisBtn : -1;
        const detected = newBtn !== undefined ? newBtn : (newAxis !== -1 ? newAxis : -1);

        if (detected !== -1) {
            const key = DIAG_KEYS[diagStep];
            if (detected >= 100) {
                // это ось — для left/right используем axisX
                gpMap[key] = -1; // сигнал: использовать ось
            } else {
                gpMap[key] = detected;
            }
            diagStep++;
            if (diagStep >= DIAG_LABELS.length) {
                // финализируем: если left/right через ось, axis уже 0
            }
        }
        diagPrevPressed = [...pressed];
        if (axisBtn !== -1) diagPrevPressed.push(axisBtn);

        // инфо о текущих нажатиях
        ctx.fillStyle = '#888';
        ctx.font = `${Math.min(w*0.04,15)}px Arial`;
        const bInfo = pressed.length ? `Кнопки: ${pressed.join(', ')}` : 'Ожидание...';
        ctx.fillText(bInfo, w/2, h*0.75);
    } else {
        ctx.fillStyle = '#44ff88';
        ctx.font = `bold ${Math.min(w*0.055,22)}px Arial`;
        ctx.fillText('Готово! Нажми экран', w/2, h*0.75);
        ctx.fillStyle = '#aaa';
        ctx.font = `${Math.min(w*0.04,15)}px Arial`;
        ctx.fillText(`← ${gpMap.left<0?'ось':gpMap.left}  → ${gpMap.right<0?'ось':gpMap.right}  A ${gpMap.action}`, w/2, h*0.87);
    }
}

function advanceLevel() {
    totalScore += score;
    if (currentLevel >= LEVELS.length - 1) {
        state = 'won'; sfx.win();
    } else {
        currentLevel++;
        goToStage();
    }
}

// ── explosion helper ──────────────────────────────────────────────────────────
function spawnExplosion(x, y) {
    for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd   = Math.random() * 3 + 1;
        explosions.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1.0, r: Math.random()*3+2 });
    }
}

// ── update ───────────────────────────────────────────────────────────────────
function update() {
    if (state === 'gpdiag') { updateWarp(); return; }
    if (state === 'title' || state === 'dead' || state === 'won' || state === 'levelclear') {
        pollGamepad(); updateWarp(); return;
    }
    if (state === 'stage') {
        pollGamepad(); updateWarp();
        stageTimer++;
        if (stageTimer >= STAGE_DUR) startLevel();
        return;
    }
    if (state !== 'playing') return;
    frame++;

    pollGamepad();
    const moveL = held.left  || keys['ArrowLeft']  || keys['a'] || gp.left;
    const moveR = held.right || keys['ArrowRight'] || keys['d'] || gp.right;
    if (moveL && player.x > 22)       player.x -= player.spd;
    if (moveR && player.x < W() - 22) player.x += player.spd;

    if (doubleGunTimer > 0) doubleGunTimer--;

    if (cooldown > 0) cooldown--;
    if (cooldown === 0) {
        if (doubleGunTimer > 0) {
            bullets.push({ x: player.x - 20, y: player.y - 24 });
            bullets.push({ x: player.x + 20, y: player.y - 24 });
        } else {
            bullets.push({ x: player.x, y: player.y - 28 });
        }
        cooldown = 10; sfx.shoot();
    }

    // бонус — спавн каждые ~8 секунд случайно
    if (frame % 500 === 480) bonuses.push({ x: Math.random() * (W() - 60) + 30, y: -20, vy: 2.5 });
    bonuses.forEach(b => b.y += b.vy);
    bonuses = bonuses.filter(b => b.y < H() + 30);
    bonuses = bonuses.filter(b => {
        if (Math.abs(b.x - player.x) < 26 && Math.abs(b.y - player.y) < 26) {
            doubleGunTimer = DOUBLE_GUN_DUR;
            sfx.levelClear();
            return false;
        }
        return true;
    });

    bullets.forEach(b => b.y -= 11);
    bullets = bullets.filter(b => b.y > 0);
    eBullets.forEach(b => b.y += b.vy);
    eBullets = eBullets.filter(b => b.y < H());
    explosions.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.045; });
    explosions = explosions.filter(p => p.life > 0);

    const alive = enemies.filter(e => e.alive);
    if (!alive.length) { levelScore = score; state = 'levelclear'; sfx.levelClear(); return; }

    enemies.forEach(e => { if (e.alive) e.x += dir * speed; });
    if (frame % 22 === 0) enemies.forEach(e => { if (e.alive) e.f++; });

    const lx = Math.min(...alive.map(e => e.x));
    const rx = Math.max(...alive.map(e => e.x));
    if (rx > W() - 28 || lx < 28) {
        dir *= -1;
        enemies.forEach(e => { if (e.alive) e.y += 22; });
        speed += 0.02;
    }

    eTimer++;
    if (eTimer >= Math.max(60, eTimerBase - alive.length * 4)) {
        eTimer = 0;
        const s = alive[Math.floor(Math.random() * alive.length)];
        eBullets.push({ x: s.x, y: s.y + 20, vy: eBulletVy });
    }

    bullets.forEach(b => {
        enemies.forEach(e => {
            if (e.alive && Math.abs(b.x-e.x) < 22 && Math.abs(b.y-e.y) < 24) {
                e.alive = false; b.y = -1; score += 10;
                spawnExplosion(e.x, e.y); sfx.enemyDie();
            }
        });
    });

    eBullets.forEach(b => {
        if (Math.abs(b.x-player.x) < 16 && Math.abs(b.y-player.y) < 16) {
            lives--; b.y = H() + 1; player.x = W() / 2;
            spawnExplosion(player.x, player.y);
            if (lives <= 0) { state = 'dead'; sfx.gameOver(); } else { sfx.playerHit(); }
        }
    });

    if (alive.some(e => e.y > player.y - 28)) { state = 'dead'; sfx.gameOver(); }
}

// ── stars ─────────────────────────────────────────────────────────────────────
const STARS = Array.from({ length: 130 }, () => ({
    fx: Math.random(), fy: Math.random(), r: Math.random()*1.5+0.3, a: Math.random()*0.8+0.2
}));

// ── warp stars (tunnel) ───────────────────────────────────────────────────────
const WARP_COUNT = 180;
function makeWarpStar() {
    const angle = Math.random() * Math.PI * 2;
    return { angle, dist: Math.random()*0.9+0.05, z: Math.random(), speed: Math.random()*0.004+0.003 };
}
const WARP = Array.from({ length: WARP_COUNT }, makeWarpStar);

function updateWarp() {
    for (let s of WARP) {
        s.z -= s.speed;
        if (s.z <= 0) { const ns = makeWarpStar(); ns.z = 1.0; Object.assign(s, ns); }
    }
}

function drawWarp(w, h) {
    const cx = w/2, cy = h/2, maxR = Math.sqrt(cx*cx+cy*cy);
    for (let s of WARP) {
        const r = s.dist * maxR, inv = 1 - s.z;
        const px = cx + Math.cos(s.angle)*r*inv, py = cy + Math.sin(s.angle)*r*inv;
        const prevInv = Math.max(0, inv - 0.06);
        const px0 = cx + Math.cos(s.angle)*r*prevInv, py0 = cy + Math.sin(s.angle)*r*prevInv;
        const alpha = Math.min(1, inv*1.4);
        ctx.strokeStyle = `rgba(180,220,255,${(alpha*0.85).toFixed(2)})`;
        ctx.lineWidth   = Math.max(0.5, inv*3.5);
        ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px,py); ctx.stroke();
    }
}

// ── draw helpers ──────────────────────────────────────────────────────────────
function drawBottle(x, y, f) {
    const s = 15;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = f%2===0 ? '#c8a020' : '#e0b824';
    ctx.beginPath(); ctx.roundRect(-s*.6,-s*.5,s*1.2,s*1.8,s*.25); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(-s*.38,s*.1,s*.76,s*.68);
    ctx.fillStyle = '#7a5a0f'; ctx.fillRect(-s*.25,-s*1.08,s*.5,s*.62);
    ctx.fillStyle = '#cc2200'; ctx.beginPath(); ctx.arc(0,-s*1.08,s*.28,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawShip(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#00ccff';
    ctx.beginPath();
    ctx.moveTo(0,-24); ctx.lineTo(20,12); ctx.lineTo(10,6);
    ctx.lineTo(0,10);  ctx.lineTo(-10,6); ctx.lineTo(-20,12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff7700';
    ctx.beginPath(); ctx.ellipse(0,12,5,8,0,0,Math.PI*2); ctx.fill();
    if (doubleGunTimer > 0) {
        // вторая пушка справа
        const glow = Math.floor(doubleGunTimer / 8) % 2 === 0;
        ctx.fillStyle = glow ? '#00ffcc' : '#00ccaa';
        // левый ствол
        ctx.fillRect(-22, -18, 5, 14);
        // правый ствол
        ctx.fillRect(17, -18, 5, 14);
    }
    ctx.restore();
}

function drawRoundBtn(x, y, r, label) {
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `bold ${Math.round(r*.7)}px Arial`; ctx.textAlign = 'center';
    ctx.fillText(label, x, y+Math.round(r*.26));
}

function draw3DText(text, x, y, fontSize) {
    ctx.font = `bold ${fontSize}px Arial`;
    const depth = Math.round(fontSize * 0.22);
    for (let i = depth; i >= 1; i--) {
        const t = i / depth;
        ctx.fillStyle = `rgb(${Math.round(120*t)},${Math.round(80*t)},0)`;
        ctx.fillText(text, x+i, y+i);
    }
    ctx.fillStyle = '#ffdd00'; ctx.fillText(text, x, y);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillText(text, x, y);
}

// ── draw ──────────────────────────────────────────────────────────────────────
function draw() {
    const w = W(), h = H(), st = safeTop();
    ctx.fillStyle = '#090a0f'; ctx.fillRect(0,0,w,h);

    const isWarpBg = (state !== 'playing');
    if (isWarpBg) {
        drawWarp(w, h);
    } else {
        STARS.forEach(s => {
            ctx.fillStyle = `rgba(255,255,255,${s.a})`;
            ctx.beginPath(); ctx.arc(s.fx*w, s.fy*h, s.r, 0, Math.PI*2); ctx.fill();
        });
    }

    // ── Title ──────────────────────────────────────────────────────────────────
    if (state === 'title') {
        const cy = h * 0.32;
        ctx.textAlign = 'center';
        const sz = Math.min(w*0.12, 52);
        draw3DText('BEER',     w/2, cy,      sz);
        draw3DText('INVADERS', w/2, cy+sz+8, sz);
        const by = cy + sz*2 + 40;
        drawBottle(w/2-60, by, 0); drawBottle(w/2, by, 1); drawBottle(w/2+60, by, 0);
        ctx.fillStyle = '#ffffff'; ctx.font = `${Math.min(w*.055,22)}px Arial`;
        ctx.fillText('Нажми чтобы начать', w/2, by+72);
        ctx.fillStyle = '#555'; ctx.font = `${Math.min(w*.04,16)}px Arial`;
        ctx.fillText('< удерживай  |  удерживай >', w/2, h*0.91);
        // gamepad status
        ctx.fillStyle = gpConnected ? '#44ff88' : '#555';
        ctx.font = `${Math.min(w*.038,14)}px Arial`;
        ctx.fillText(gpConnected ? '🎮 Геймпад подключён' : '🎮 Геймпад не найден', w/2, h*0.83);
        if (gpConnected) {
            ctx.fillStyle = '#aaa';
            ctx.font = `${Math.min(w*.032,12)}px Arial`;
            ctx.fillText('Удержи Select+Start для настройки кнопок', w/2, h*0.875);
        }
        return;
    }

    // ── Gamepad diagnostics ────────────────────────────────────────────────────
    if (state === 'gpdiag') { drawGpDiag(); return; }

    // ── Stage announce ─────────────────────────────────────────────────────────
    if (state === 'stage') {
        // Blink: visible for 20 frames, hidden for 12 frames → cycle 32
        const blink = Math.floor(stageTimer / 10) % 3 !== 2;
        if (blink) {
            const sz = Math.min(w*0.13, 58);
            ctx.textAlign = 'center';
            draw3DText(`STAGE  ${currentLevel + 1}`, w/2, h/2, sz);
        }
        // thin progress bar at bottom
        const prog = stageTimer / STAGE_DUR;
        ctx.fillStyle = 'rgba(255,220,0,0.35)';
        ctx.fillRect(0, h-4, w*prog, 4);
        return;
    }

    // ── Level Clear ────────────────────────────────────────────────────────────
    if (state === 'levelclear') {
        ctx.textAlign = 'center';
        const sz = Math.min(w*0.10, 44);
        draw3DText(`STAGE  ${currentLevel+1}  CLEAR!`, w/2, h*0.22, sz);

        // Score panel — centered lower so it doesn't overlap the title
        const px = w/2, py = h*0.58;
        const bw = Math.min(w*0.7, 320), bh = 130;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath(); ctx.roundRect(px-bw/2, py-bh/2, bw, bh, 16); ctx.fill();
        ctx.strokeStyle = 'rgba(255,220,0,0.4)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(px-bw/2, py-bh/2, bw, bh, 16); ctx.stroke();

        ctx.fillStyle = '#ccc'; ctx.font = `${Math.min(w*.05,20)}px Arial`;
        ctx.fillText('Этот уровень', px, py - 28);
        ctx.fillStyle = '#ffdd00'; ctx.font = `bold ${Math.min(w*.085,36)}px Arial`;
        ctx.fillText(`+${levelScore}`, px, py + 14);
        ctx.fillStyle = '#aaa'; ctx.font = `${Math.min(w*.042,17)}px Arial`;
        ctx.fillText(`Всего: ${totalScore + levelScore}`, px, py + 50);

        const isLast = currentLevel >= LEVELS.length - 1;
        const btnLabel = isLast ? 'Финальный экран' : 'Следующий уровень';
        const btnY = py + 95;
        const btnW = Math.min(w*0.62, 260), btnH = 46;
        // button bg
        ctx.fillStyle = '#e6b800';
        ctx.beginPath(); ctx.roundRect(px-btnW/2, btnY-btnH/2, btnW, btnH, btnH/2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath(); ctx.roundRect(px-btnW/2, btnY-btnH/2, btnW, btnH/2, [btnH/2,btnH/2,0,0]); ctx.fill();
        // button text
        ctx.fillStyle = '#1a0f00'; ctx.font = `bold ${Math.min(w*.05,19)}px Arial`;
        ctx.fillText(btnLabel, px, btnY + 7);
        return;
    }

    // ── Dead / Won ─────────────────────────────────────────────────────────────
    if (state === 'dead' || state === 'won') {
        ctx.textAlign = 'center';
        const sz = Math.min(w*0.11, 48);
        if (state === 'won') {
            draw3DText('ВЫ ПОБЕДИЛИ!', w/2, h/2 - 60, sz);
        } else {
            ctx.font = `bold ${sz}px Arial`; ctx.fillStyle = '#ff4444';
            ctx.fillText('GAME OVER', w/2, h/2 - 60);
        }

        // Score panel
        const px = w/2, py = h/2 + 10;
        const bw = Math.min(w*0.72, 330), bh = state==='won' ? 150 : 100;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath(); ctx.roundRect(px-bw/2, py-bh/2, bw, bh, 16); ctx.fill();
        ctx.strokeStyle = 'rgba(255,220,0,0.35)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(px-bw/2, py-bh/2, bw, bh, 16); ctx.stroke();

        if (state === 'won') {
            ctx.fillStyle = '#aaa'; ctx.font = `${Math.min(w*.044,18)}px Arial`;
            ctx.fillText(`Последний уровень: +${levelScore}`, px, py - 36);
            ctx.fillStyle = '#ffdd00'; ctx.font = `bold ${Math.min(w*.085,36)}px Arial`;
            ctx.fillText(`Итого: ${totalScore + levelScore}`, px, py + 8);
            ctx.fillStyle = '#aaa'; ctx.font = `${Math.min(w*.04,16)}px Arial`;
            ctx.fillText('Все 5 уровней пройдены!', px, py + 44);
        } else {
            ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.min(w*.07,30)}px Arial`;
            ctx.fillText(`Score: ${totalScore + score}`, px, py + 14);
        }

        ctx.fillStyle = '#888'; ctx.font = `${Math.min(w*.044,18)}px Arial`;
        ctx.fillText('Нажми чтобы вернуться', px, py + bh/2 + 40);
        return;
    }

    // ── Playing ────────────────────────────────────────────────────────────────
    enemies.forEach(e => { if (e.alive) drawBottle(e.x, e.y, e.f); });
    drawShip(player.x, player.y);

    ctx.fillStyle = '#00ffff';
    bullets.forEach(b => ctx.fillRect(b.x-2, b.y, 4, 14));
    ctx.fillStyle = '#ff5500';
    eBullets.forEach(b => ctx.fillRect(b.x-2, b.y, 4, 12));

    explosions.forEach(p => {
        ctx.fillStyle = `rgba(255,${Math.floor(p.life*180)},0,${p.life.toFixed(2)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2); ctx.fill();
    });

    // HUD
    const hudY = st + 50;
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'left';
    ctx.fillStyle = 'white'; ctx.fillText(`${totalScore + score}`, 18, hudY);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 18px Arial';
    ctx.fillText(`STAGE ${currentLevel+1}`, w/2, hudY);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ff4466'; ctx.font = 'bold 18px Arial';
    ctx.fillText('♥'.repeat(lives), w-18, hudY);

    // двойная пушка — мигающий индикатор
    if (doubleGunTimer > 0 && Math.floor(doubleGunTimer / 8) % 2 === 0) {
        ctx.textAlign = 'center'; ctx.fillStyle = '#00ffcc'; ctx.font = `bold ${Math.min(w*0.04,15)}px Arial`;
        ctx.fillText('⚡ DOUBLE', w/2, hudY + 22);
    }

    // отрисовка бонусов
    bonuses.forEach(b => {
        const pulse = 0.7 + 0.3 * Math.sin(frame * 0.15);
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(frame * 0.05);
        ctx.fillStyle = `rgba(0,255,200,${pulse})`;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const a = (i * 4 * Math.PI / 5) - Math.PI / 2;
            const r = i % 2 === 0 ? 14 : 6;
            i === 0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
    });

    drawRoundBtn(w*0.12, h-52, 45, '<');
    drawRoundBtn(w*0.88, h-52, 45, '>');
}

// ── 8-bit audio ───────────────────────────────────────────────────────────────
let audioCtx = null;
function getACtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone({ type = 'square', freq = 440, freq2, dur = 0.1, vol = 0.3,
                    attack = 0.005, decay = 0, sustain = 1, release = 0.05,
                    delay = 0 } = {}) {
    try {
        const ac = getACtx();
        const t  = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (freq2 !== undefined) osc.frequency.linearRampToValueAtTime(freq2, t + dur);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol * sustain, t + attack);
        if (decay > 0) gain.gain.linearRampToValueAtTime(vol * sustain * 0.7, t + attack + decay);
        gain.gain.setValueAtTime(vol * sustain, t + dur);
        gain.gain.linearRampToValueAtTime(0, t + dur + release);
        osc.start(t); osc.stop(t + dur + release + 0.01);
    } catch(e) {}
}

function playNoise({ dur = 0.15, vol = 0.3, freq = 800, freq2 = 100, delay = 0 } = {}) {
    try {
        const ac = getACtx();
        const t  = ac.currentTime + delay;
        const bufSize = ac.sampleRate * (dur + 0.05);
        const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const src = ac.createBufferSource();
        src.buffer = buf;
        const filt = ac.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.setValueAtTime(freq, t);
        filt.frequency.linearRampToValueAtTime(freq2, t + dur);
        const gain = ac.createGain();
        gain.gain.setValueAtTime(vol, t);
        gain.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
        src.start(t); src.stop(t + dur + 0.05);
    } catch(e) {}
}

const sfx = {
    shoot() {
        playTone({ type: 'square', freq: 880, freq2: 440, dur: 0.04, vol: 0.18, release: 0.02 });
    },
    enemyDie() {
        playNoise({ dur: 0.18, vol: 0.4, freq: 1200, freq2: 200 });
        playTone({ type: 'square', freq: 220, freq2: 80, dur: 0.15, vol: 0.25, release: 0.05 });
    },
    playerHit() {
        playNoise({ dur: 0.35, vol: 0.55, freq: 600, freq2: 80 });
        playTone({ type: 'sawtooth', freq: 120, freq2: 60, dur: 0.3, vol: 0.4, release: 0.1 });
    },
    levelClear() {
        const melody = [523, 659, 784, 1047];
        melody.forEach((f, i) => playTone({ type: 'square', freq: f, dur: 0.1, vol: 0.3, release: 0.05, delay: i * 0.12 }));
    },
    gameOver() {
        const melody = [440, 349, 293, 220];
        melody.forEach((f, i) => playTone({ type: 'sawtooth', freq: f, dur: 0.15, vol: 0.35, release: 0.08, delay: i * 0.18 }));
    },
    win() {
        const melody = [523, 659, 784, 659, 784, 1047];
        melody.forEach((f, i) => playTone({ type: 'square', freq: f, dur: 0.12, vol: 0.32, release: 0.05, delay: i * 0.13 }));
    },
};

// ── loop ──────────────────────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(() => { resize(); loop(); });
</script>
