<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090a0f">
    <title>Вход - Beer Invaders</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #090a0f 0%, #1a1b2e 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(26, 27, 46, 0.95);
            border: 2px solid #e0b824;
            border-radius: 10px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(224, 184, 36, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .login-container h1 {
            color: #e0b824;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(224, 184, 36, 0.5);
        }

        .login-container p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #e0b824;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0b824;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(224, 184, 36, 0.5);
            border-color: #f0c834;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #e0b824;
            color: #090a0f;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #f0c834;
            box-shadow: 0 0 20px rgba(224, 184, 36, 0.6);
            transform: scale(1.02);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #ff4444;
            margin-top: 15px;
            font-size: 13px;
            display: none;
            animation: shake 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .demo-credentials {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(224, 184, 36, 0.3);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .demo-credentials p {
            margin: 5px 0;
        }

        .loading {
            display: none;
            text-align: center;
            color: #e0b824;
        }

        .spinner {
            border: 3px solid rgba(224, 184, 36, 0.3);
            border-top: 3px solid #e0b824;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🍺 Beer Invaders</h1>
        <p>Добро пожаловать! Введите учетные данные</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Пользователь:</label>
                <input type="text" id="username" name="username" placeholder="Введите имя пользователя" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>

            <button type="button" class="login-btn" id="loginBtn">Вход</button>

            <div class="error-message" id="errorMessage"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Загрузка игры...</p>
            </div>
        </form>

        <div class="demo-credentials">
            <p><strong>Тестовые учетные данные:</strong></p>
            <p>admin / admin123</p>
            <p>player / player123</p>
            <p>test / test123</p>
        </div>
    </div>

    <script>
        // Тестовые пользователи (в продакшене это должно быть на сервере)
        const users = {
            'admin': 'admin123',
            'player': 'player123',
            'test': 'test123'
        };

        const loginBtn = document.getElementById('loginBtn');
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Функция входа
        function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Очистка сообщения об ошибке
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Валидация
            if (!username || !password) {
                showError('Пожалуйста, заполните оба поля');
                return;
            }

            // Проверка учетных данных
            if (!users[username] || users[username] !== password) {
                showError('Неверное имя пользователя или пароль');
                usernameInput.value = '';
                passwordInput.value = '';
                usernameInput.focus();
                return;
            }

            // Успешный вход
            successLogin(username);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function successLogin(username) {
            // Показываем индикатор загрузки
            loginForm.style.display = 'none';
            loading.style.display = 'block';

            // Сохраняем данные пользователя в sessionStorage
            sessionStorage.setItem('username', username);
            sessionStorage.setItem('authenticated', 'true');

            // Имитируем загрузку игры
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // Обработчики событий
        loginBtn.addEventListener('click', handleLogin);
        loginForm.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // Автофокус на поле логина
        usernameInput.focus();

        // Проверка: если пользователь уже авторизован, переходим на игру
        if (sessionStorage.getItem('authenticated') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
